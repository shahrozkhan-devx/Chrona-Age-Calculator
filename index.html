<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrona - Age Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Comic+Neue:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="main-heading">Chrona</h1>

    <div class="main-container">

        <div class="display">
            <input type="date" id="birthdate">
        </div>

        <div class="buttons">
            <button id="calculateBtn">Calculate</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="result">
            <p id="ageResult">Your age will appear here</p>
        </div>

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <footer style="width:100%;padding:18px 20px;text-align:center;font-size:13px;color:inherit;position:fixed;bottom:0;left:0">Copyright © 2026 All rights reserved | This template is made with <a href="https://github.com/shahrozkhan-tech" target="_blank" rel="noopener" style="color:inherit">shahroz khan</a></footer>
    <script src="app.js"></script>
</body>

</html>
